<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - ALLIED E-Book Management System</title>

    <meta name="description"
          content="Create an account for the ALLIED E-Book Management System.">

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>
        ALLIED E-Book Management System
    </h1>

</header>



<!-- =========================
     REGISTER SECTION
========================= -->

<section class="hero">

    <h2>
        📝 Create Account
    </h2>


    <!-- USERNAME -->

    <input
        type="text"
        id="newUsername"
        placeholder="Enter Username"
        autocomplete="name"
    >


    <br><br>


    <!-- EMAIL -->

    <input
        type="email"
        id="newEmail"
        placeholder="Enter Email"
        autocomplete="email"
    >


    <br><br>


    <!-- PASSWORD -->

    <input
        type="password"
        id="newPassword"
        placeholder="Enter Password"
        autocomplete="new-password"
    >


    <br><br>


    <!-- REGISTER BUTTON -->

    <button
        type="button"
        id="registerButton">

        Register

    </button>


    <!-- MESSAGE -->

    <p id="message"></p>


    <!-- LOGIN -->

    <p>

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </p>

</section>



<!-- =========================
     FIREBASE REGISTRATION
========================= -->

<script type="module">

    import {
        auth,
        db,
        doc,
        setDoc,
        createUserWithEmailAndPassword,
        sendEmailVerification,
        signOut
    } from "./firebase.js";



    /* =========================
       GET ELEMENTS
    ========================== */

    const registerButton =
        document.getElementById(
            "registerButton"
        );


    const message =
        document.getElementById(
            "message"
        );



    /* =========================
       REGISTER BUTTON
    ========================== */

    registerButton.addEventListener(
        "click",
        async () => {


            /* =========================
               GET USERNAME
            ========================== */

            const username =
                document.getElementById(
                    "newUsername"
                ).value.trim();



            /* =========================
               GET EMAIL
            ========================== */

            const email =
                document.getElementById(
                    "newEmail"
                ).value.trim();



            /* =========================
               GET PASSWORD
            ========================== */

            const password =
                document.getElementById(
                    "newPassword"
                ).value;



            /* =========================
               USERNAME VALIDATION
            ========================== */

            if (username === "") {

                message.textContent =
                    "Please enter your username.";

                return;

            }



            /* =========================
               EMAIL VALIDATION
            ========================== */

            if (email === "") {

                message.textContent =
                    "Please enter your email.";

                return;

            }



            /* =========================
               PASSWORD VALIDATION
            ========================== */

            if (password === "") {

                message.textContent =
                    "Please enter a password.";

                return;

            }


            if (password.length < 6) {

                message.textContent =
                    "Password must be at least 6 characters.";

                return;

            }



            /* =========================
               START REGISTRATION
            ========================== */

            try {


                message.textContent =
                    "Creating your account...";


                registerButton.disabled = true;



                /* =========================
                   CREATE FIREBASE ACCOUNT
                ========================== */

                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    userCredential.user;



                /* =========================
                   SAVE USER TO FIRESTORE
                ========================== */

                await setDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    ),
                    {

                        name: username,

                        email: email,

                        emailVerified:
                            user.emailVerified,

                        createdAt:
                            new Date()

                    }
                );



                /* =========================
                   SEND VERIFICATION EMAIL
                ========================== */

                await sendEmailVerification(
                    user
                );



                /* =========================
                   SIGN OUT
                ========================== */

                await signOut(auth);



                /* =========================
                   SUCCESS MESSAGE
                ========================== */

                message.textContent =
                    "Registration successful! " +
                    "A verification email has been sent to " +
                    email +
                    ". Please verify your email before logging in.";



                /* =========================
                   CLEAR FORM
                ========================== */

                document.getElementById(
                    "newUsername"
                ).value = "";


                document.getElementById(
                    "newEmail"
                ).value = "";


                document.getElementById(
                    "newPassword"
                ).value = "";



                registerButton.disabled =
                    false;



                /* =========================
                   GO TO LOGIN
                ========================== */

                setTimeout(
                    () => {

                        window.location.href =
                            "login.html";

                    },
                    3000
                );


            }



            /* =========================
               REGISTRATION ERROR
            ========================== */

            catch (error) {

                console.error(error);


                registerButton.disabled =
                    false;



                /* =========================
                   EMAIL ALREADY EXISTS
                ========================== */

                if (
                    error.code ===
                    "auth/email-already-in-use"
                ) {

                    message.textContent =
                        "This email is already registered.";

                }



                /* =========================
                   INVALID EMAIL
                ========================== */

                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    message.textContent =
                        "Please enter a valid email address.";

                }



                /* =========================
                   WEAK PASSWORD
                ========================== */

                else if (
                    error.code ===
                    "auth/weak-password"
                ) {

                    message.textContent =
                        "Password is too weak. Use at least 6 characters.";

                }



                /* =========================
                   AUTH NOT ENABLED
                ========================== */

                else if (
                    error.code ===
                    "auth/operation-not-allowed"
                ) {

                    message.textContent =
                        "Email/Password authentication is not enabled.";

                }



                /* =========================
                   OTHER ERROR
                ========================== */

                else {

                    message.textContent =
                        "Registration failed: " +
                        error.message;

                }

            }

        }

    );

</script>



<!-- =========================
     FOOTER
========================= -->

<footer>

    <br>

    <a href="https://instagram.com/_obito_112__">
        Instagram Page
    </a>

    <br><br>

    <p>
        Thank you for visiting the
        ALLIED E-Book Management System. 🙏
    </p>

</footer>


</body>

</html>
