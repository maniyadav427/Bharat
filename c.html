<!-- ==================================================
     FIREBASE AUTHENTICATION
================================================== -->

<script type="module">

    import {
        auth,
        onAuthStateChanged
    } from "./firebase.js";


    const authChecking =
        document.getElementById("authChecking");


    const bookContent =
        document.getElementById("bookContent");


    onAuthStateChanged(auth, async (user) => {


        /* ==========================================
           NO USER
        =========================================== */

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }


        /* ==========================================
           REFRESH USER INFORMATION
        =========================================== */

        try {

            await user.reload();

        }

        catch (error) {

            console.error(
                "User reload error:",
                error
            );

        }


        const currentUser =
            auth.currentUser;


        /* ==========================================
           USER DOES NOT EXIST
        =========================================== */

        if (!currentUser) {

            window.location.href =
                "login.html";

            return;

        }


        /* ==========================================
           EMAIL NOT VERIFIED
        =========================================== */

        if (!currentUser.emailVerified) {

            alert(
                "Please verify your email before accessing C Programming."
            );

            window.location.href =
                "login.html";

            return;

        }


        /* ==========================================
           VERIFIED USER
        =========================================== */

        authChecking.style.display =
            "none";


        bookContent.style.display =
            "block";

    });

</script>
