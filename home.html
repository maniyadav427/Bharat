<!-- Firebase -->

<script type="module">

    import {
        auth,
        onAuthStateChanged
    } from "./firebase.js";


    let currentUser = null;


    const loginStatus =
        document.getElementById("loginStatus");


    /*
     * Check Firebase login status
     */

    onAuthStateChanged(auth, (user) => {

        currentUser = user;


        if (user && user.emailVerified) {

            loginStatus.textContent =
                "You are logged in. You can open the books. ✅";

        }

        else {

            loginStatus.textContent =
                "Please login to access the books. 🔐";

        }

    });


    /*
     * Open selected book
     */

    window.openBook = function(bookPage) {


        /*
         * User is not logged in
         */

        if (!currentUser) {

            alert(
                "Please login first to access the books."
            );

            window.location.href =
                "login.html";

            return;

        }


        /*
         * User has not verified email
         */

        if (!currentUser.emailVerified) {

            alert(
                "Please verify your email before accessing the books."
            );

            window.location.href =
                "login.html";

            return;

        }


        /*
         * User is authenticated and verified
         */

        window.location.href =
            bookPage;

    };

</script>
