<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - ALLIED E-Book Management System</title>

    <meta name="description"
          content="Login to access the ALLIED E-Book Management System.">

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<header>

    <h1>
        ALLIED E-Book Management System
    </h1>

</header>



<section class="hero">

    <h2>
        🔐 Login
    </h2>


    <input
        type="email"
        id="username"
        placeholder="Enter Email"
        autocomplete="email"
    >

    <br><br>


    <input
        type="password"
        id="password"
        placeholder="Enter Password"
        autocomplete="current-password"
    >

    <br><br>


    <button
        type="button"
        id="loginButton">

        Login

    </button>


    <p id="message"></p>


    <p>

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </p>

</section>



<!-- =========================
     FIREBASE LOGIN
========================= -->

<script type="module">

import {
    auth,
    signInWithEmailAndPassword,
    sendEmailVerification,
    signOut
} from "./firebase.js";


const loginButton =
    document.getElementById("loginButton");


const message =
    document.getElementById("message");



loginButton.addEventListener(
    "click",
    async () => {


        const email =
            document.getElementById(
                "username"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;



        /* =========================
           VALIDATION
        ========================== */


        if (email === "") {

            message.textContent =
                "Please enter your email.";

            return;

        }


        if (password === "") {

            message.textContent =
                "Please enter your password.";

            return;

        }



        /* =========================
           LOGIN
        ========================== */

        try {

            message.textContent =
                "Logging in...";


            const userCredential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                userCredential.user;



            /* =========================
               REFRESH USER
            ========================== */

            await user.reload();



            /* =========================
               EMAIL VERIFICATION
            ========================== */

            if (!auth.currentUser.emailVerified) {


                await sendEmailVerification(
                    auth.currentUser
                );


                await signOut(auth);


                message.textContent =
                    "Your email is not verified. " +
                    "A new verification email has been sent. " +
                    "Please verify your email and try again.";


                return;

            }



            /* =========================
               LOGIN SUCCESS
            ========================== */

            message.textContent =
                "Login successful!";


            /*
             * Check whether the user
             * selected a book before
             * coming to the login page.
             */

            const requestedBook =
                sessionStorage.getItem(
                    "requestedBook"
                );



            /* =========================
               OPEN SELECTED BOOK
            ========================== */

            if (requestedBook) {


                /*
                 * Remove it so it isn't
                 * opened again later.
                 */

                sessionStorage.removeItem(
                    "requestedBook"
                );


                /*
                 * Open the selected book.
                 */

                window.location.href =
                    requestedBook;


            }

            else {


                /*
                 * User logged in normally.
                 * Go to home page.
                 */

                window.location.href =
                    "home.html";

            }


        }


        /* =========================
           LOGIN ERRORS
        ========================== */

        catch (error) {

            console.error(error);


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                message.textContent =
                    "Incorrect email or password.";

            }


            else if (
                error.code ===
                "auth/user-not-found"
            ) {

                message.textContent =
                    "No account found with this email.";

            }


            else if (
                error.code ===
                "auth/wrong-password"
            ) {

                message.textContent =
                    "Incorrect password.";

            }


            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                message.textContent =
                    "Please enter a valid email.";

            }


            else {

                message.textContent =
                    "Login failed: " +
                    error.message;

            }

        }

    }

);

</script>



<!-- =========================
     FOOTER
========================= -->

<footer>

    <br>

    <p>
        If you have any problem with login,
        please contact the website administrator.
    </p>

    <p>
        Thank you for visiting the
        ALLIED E-Book Management System. 🙏
    </p>

</footer>


</body>

</html>
