<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - ALLIED E-Book Management System</title>

    <meta name="description"
          content="Login to access the ALLIED E-Book Management System.">

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>
        ALLIED E-Book Management System
    </h1>

</header>



<!-- =========================
     LOGIN SECTION
========================= -->

<section class="hero">

    <h2>
        🔐 Login
    </h2>


    <!-- EMAIL -->

    <input
        type="email"
        id="username"
        placeholder="Enter Email"
        autocomplete="email"
    >


    <br><br>


    <!-- PASSWORD -->

    <input
        type="password"
        id="password"
        placeholder="Enter Password"
        autocomplete="current-password"
    >


    <br><br>


    <!-- LOGIN BUTTON -->

    <button
        type="button"
        id="loginButton">

        Login

    </button>


    <!-- MESSAGE -->

    <p id="message"></p>


    <!-- REGISTER -->

    <p>

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </p>

</section>



<!-- =========================
     FIREBASE LOGIN
========================= -->

<script type="module">

import {
    auth,
    signInWithEmailAndPassword,
    sendEmailVerification,
    signOut
} from "./firebase.js";



/* =========================
   GET HTML ELEMENTS
========================= */

const loginButton =
    document.getElementById(
        "loginButton"
    );


const message =
    document.getElementById(
        "message"
    );



/* =========================
   LOGIN BUTTON
========================= */

loginButton.addEventListener(
    "click",
    async () => {


        /* =========================
           GET EMAIL
        ========================== */

        const email =
            document.getElementById(
                "username"
            ).value.trim();


        /* =========================
           GET PASSWORD
        ========================== */

        const password =
            document.getElementById(
                "password"
            ).value;



        /* =========================
           VALIDATE EMAIL
        ========================== */

        if (email === "") {

            message.textContent =
                "Please enter your email.";

            return;

        }



        /* =========================
           VALIDATE PASSWORD
        ========================== */

        if (password === "") {

            message.textContent =
                "Please enter your password.";

            return;

        }



        /* =========================
           START LOGIN
        ========================== */

        try {


            message.textContent =
                "Logging in...";


            loginButton.disabled = true;



            /* =========================
               FIREBASE LOGIN
            ========================== */

            const userCredential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                userCredential.user;



            /* =========================
               REFRESH USER
            ========================== */

            await user.reload();



            /* =========================
               CHECK EMAIL VERIFICATION
            ========================== */

            if (
                !auth.currentUser.emailVerified
            ) {


                /*
                 * Send verification email
                 */

                await sendEmailVerification(
                    auth.currentUser
                );


                /*
                 * Sign the user out
                 */

                await signOut(auth);


                /*
                 * Show message
                 */

                message.textContent =
                    "Your email is not verified. " +
                    "A new verification email has been sent. " +
                    "Please verify your email and login again.";


                loginButton.disabled = false;


                return;

            }



            /* =========================
               LOGIN SUCCESS
            ========================== */

            message.textContent =
                "Login successful! ✅";



            /* =========================
               CHECK REQUESTED BOOK
            ========================== */

            const requestedBook =
                sessionStorage.getItem(
                    "requestedBook"
                );



            /* =========================
               BOOK WAS SELECTED
            ========================== */

            if (requestedBook) {


                /*
                 * Remove saved book
                 * so it won't open again
                 */

                sessionStorage.removeItem(
                    "requestedBook"
                );


                /*
                 * Small delay so
                 * login success can show
                 */

                setTimeout(
                    () => {

                        window.location.href =
                            requestedBook;

                    },
                    300
                );


            }



            /* =========================
               NO BOOK WAS SELECTED
            ========================== */

            else {


                /*
                 * Normal login
                 * → Home page
                 */

                setTimeout(
                    () => {

                        window.location.href =
                            "home.html";

                    },
                    300
                );

            }


        }



        /* =========================
           LOGIN ERROR
        ========================== */

        catch (error) {


            console.error(error);


            loginButton.disabled = false;



            /* =========================
               INVALID CREDENTIAL
            ========================== */

            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                message.textContent =
                    "Incorrect email or password.";

            }



            /* =========================
               USER NOT FOUND
            ========================== */

            else if (
                error.code ===
                "auth/user-not-found"
            ) {

                message.textContent =
                    "No account found with this email.";

            }



            /* =========================
               WRONG PASSWORD
            ========================== */

            else if (
                error.code ===
                "auth/wrong-password"
            ) {

                message.textContent =
                    "Incorrect password.";

            }



            /* =========================
               INVALID EMAIL
            ========================== */

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                message.textContent =
                    "Please enter a valid email.";

            }



            /* =========================
               TOO MANY REQUESTS
            ========================== */

            else if (
                error.code ===
                "auth/too-many-requests"
            ) {

                message.textContent =
                    "Too many login attempts. Please try again later.";

            }



            /* =========================
               OTHER ERROR
            ========================== */

            else {

                message.textContent =
                    "Login failed: " +
                    error.message;

            }

        }

    }

);

</script>



<!-- =========================
     FOOTER
========================= -->

<footer>

    <br>


    <p>
        If you have any problem with login,
        please contact the website administrator.
    </p>


    <p>
        Thank you for visiting the
        ALLIED E-Book Management System. 🙏
    </p>

</footer>


</body>

</html>
